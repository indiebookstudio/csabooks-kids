<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO & Meta Tags -->
  <meta name="description" content="CSA Books 4 Kids: libri illustrati e storie educative per bambini di 2-5 anni di Marco Salucci. Scopri la collana Le Avventure del Cantiere su Amazon." />
  <meta name="keywords" content="CSA Books 4 Kids, libri per bambini, libri illustrati 2-5 anni, Le Avventure del Cantiere, Construction Site Adventures, Marco Salucci, Amazon libri bambini" />
  <meta name="author" content="Marco Salucci - CSA Books 4 Kids" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CSA Books 4 Kids | Libri illustrati per bambini" />
  <meta property="og:description" content="Grandi macchine, piccole avventure. Scopri la collana di libri per bambini di Marco Salucci." />
  <meta property="og:image" content="assets/construction-site-adventures/Logo.ITA.v2.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CSA Books 4 Kids | Children's Picture Books" />
  <meta name="twitter:description" content="Picture books and fun stories for curious little minds." />
  <meta name="twitter:image" content="assets/construction-site-adventures/Logo.ITA.v2.png" />

  <!-- Google Fonts: Fredoka & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ======================================================================
       HEADER & BARRA DI CONTROLLO
       ====================================================================== -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- Brand Logo con Logo Collana sulla sinistra -->
      <div class="brand-identity" aria-label="CSA Books 4 Kids">
        <img 
          src="assets/construction-site-adventures/Logo.ITA.v2.png" 
          alt="Logo Collana" 
          class="header-series-logo" 
          id="series-logo-img"
        />
        <div class="brand-text-group">
          <span class="brand-name">CSA Books <span class="highlight">4 Kids</span></span>
          <span class="brand-tagline">Kids Publishing</span>
        </div>
      </div>

      <!-- Header Actions: Social & Language Switcher -->
      <div class="header-actions">
        <!-- Social Pills -->
        <div class="social-header-links">
          <a href="https://www.instagram.com/csabooks.kids" target="_blank" rel="noopener noreferrer" class="social-pill-link" aria-label="Instagram @csabooks.kids">
            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
            <span>@csabooks.kids</span>
          </a>
          <a href="https://www.tiktok.com/@csabooks.kids" target="_blank" rel="noopener noreferrer" class="social-pill-link" aria-label="TikTok @csabooks.kids">
            <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.89 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3 15.67 6.34 6.34 0 0 0 9.34 22a6.34 6.34 0 0 0 6.34-6.33V8.87a8.28 8.28 0 0 0 4.91 1.6V7.02a4.85 4.85 0 0 1-1-.33z"/></svg>
            <span>@csabooks.kids</span>
          </a>
        </div>

        <!-- Selettore Lingua Rapido -->
        <div class="lang-switcher-box" role="group" aria-label="Seleziona Lingua">
          <button type="button" class="lang-btn active" data-lang="it" onclick="setLanguage('it')" aria-pressed="true">
            <span>🇮🇹</span>
            <span>Italiano</span>
          </button>
          <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')" aria-pressed="false">
            <span>🇬🇧</span>
            <span>English</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- ======================================================================
         GRIGLIA CATALOGO LIBRI (8 CARD IMMEDIATAMENTE VISIBILI)
         ====================================================================== -->
    <section class="catalog-section" id="catalogo">
      <div class="container">
        <div class="catalog-grid" id="books-catalog-grid">
          <!-- Popolato dinamicamente da script.js -->
        </div>
      </div>
    </section>

  </main>

  <!-- ======================================================================
       FOOTER
       ====================================================================== -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <div>
          <div class="footer-brand-title">CSA Books 4 Kids</div>
          <p id="footer-about-text" style="max-width: 500px; font-size: 0.9rem;">
            Storie e libri illustrati pensati per accendere la fantasia e la curiosità dei più piccoli.
          </p>
        </div>
      </div>

      <div class="footer-bottom-copy">
        <p id="footer-copyright-text">&copy; 2026 CSA Books 4 Kids. Tutti i diritti riservati.</p>
      </div>
    </div>
  </footer>

  <!-- ======================================================================
       MODAL POPUP ANTEPRIMA LIBRO (READ SAMPLE)
       ====================================================================== -->
  <div class="sample-modal-backdrop" id="sample-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="sample-modal-title">
    <div class="sample-modal-dialog">
      <div class="sample-modal-header">
        <div class="sample-modal-title-group">
          <span class="sample-modal-badge" id="sample-modal-badge">📖 Read Sample</span>
          <h3 class="sample-modal-title" id="sample-modal-title">Titolo Libro</h3>
        </div>
        <button type="button" class="sample-modal-close" onclick="closeSampleModal()" aria-label="Chiudi anteprima">✕</button>
      </div>

      <div class="sample-modal-body">
        <button type="button" class="sample-nav-btn prev" id="sample-prev-btn" onclick="changeSamplePage(-1)" aria-label="Pagina precedente">◀</button>
        
        <div class="sample-page-viewer" id="sample-viewer">
          <div class="sample-img-container">
            <img src="" alt="Anteprima pagina" id="sample-page-img" class="sample-page-img" />
          </div>
          <div class="sample-page-info">
            <span class="sample-page-label" id="sample-page-label">Copertina</span>
            <span class="sample-page-counter" id="sample-page-counter">1 / 9</span>
          </div>
        </div>

        <button type="button" class="sample-nav-btn next" id="sample-next-btn" onclick="changeSamplePage(1)" aria-label="Pagina successiva">▶</button>
      </div>

      <div class="sample-modal-footer" id="sample-modal-footer">
        <!-- Bottone Amazon dinamico popolato da script.js -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="books.js"></script>
  <script src="script.js"></script>
</body>
</html>
