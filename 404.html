<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reindirizzamento... | CSA Books 4 Kids</title>
  <meta name="robots" content="noindex, nofollow" />

  <script>
    // =========================================================================
    // DISPATCHER IMMUTABILE DI SICUREZZA PER QR CODE STAMPATI NEI LIBRI CARTACEI
    // Se un lettore scansiona un QR code e l'app scanner/browser aggiunge uno slash
    // finale (es. /slug/) o parametri extra, questo script intercetta la richiesta
    // e reindirizza istantaneamente alla pagina esatta senza mostrare mai errore 404.
    // =========================================================================
    (function() {
      try {
        var rawPath = window.location.pathname.toLowerCase();
        // Rimuove slash multipli o finali
        var cleanPath = rawPath.replace(/\/+$/, '');
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Registro immutabile dei QR code fisici stampati nei libri
        var QR_REGISTRY = {
          'csa-vol1-bonus-8f2e91b7d4a6': '/csa-vol1-bonus-8f2e91b7d4a6.html',
          'csa-vol1-ep1-ita-7b3f91a8d2c4': '/csa-vol1-ep1-ita-7b3f91a8d2c4.html',
          'csa-vol1-ep2-ita-4d9e16a2c8f1': '/csa-vol1-ep2-ita-4d9e16a2c8f1.html',
          'csa-vol1-ep3-ita-9a5c83e1f7d2': '/csa-vol1-ep3-ita-9a5c83e1f7d2.html',
          'csa-vol1-ep4-ita-6e2b94f0a3c5': '/csa-vol1-ep4-ita-6e2b94f0a3c5.html',
          'csa-vol2-bonus-46c694dc3ec4': '/csa-vol2-bonus-46c694dc3ec4.html',
          'csa-vol2-ep1-ita-1c683f8acb67': '/csa-vol2-ep1-ita-1c683f8acb67.html',
          'csa-vol2-ep2-ita-ed3dabb448ca': '/csa-vol2-ep2-ita-ed3dabb448ca.html',
          'csa-vol2-ep3-ita-2779f3736b81': '/csa-vol2-ep3-ita-2779f3736b81.html',
          'csa-vol2-ep4-ita-605c1bd7e4ce': '/csa-vol2-ep4-ita-605c1bd7e4ce.html'
        };

        for (var slug in QR_REGISTRY) {
          if (cleanPath.indexOf(slug) !== -1) {
            window.location.replace(QR_REGISTRY[slug] + search + hash);
            return;
          }
        }

        // Se è un percorso generico non trovato, rimanda alla homepage
        if (cleanPath !== '' && cleanPath !== '/') {
          window.location.replace('/' + search + hash);
        }
      } catch (err) {
        window.location.replace('/');
      }
    })();
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #FAF7F2;
      color: #151D2A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
      box-sizing: border-box;
    }
    .redirect-card {
      background: #FFFFFF;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 460px;
      width: 100%;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #FFE0D1;
      border-top-color: #F05A28;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 0.75rem 0;
      color: #F05A28;
    }
    p {
      color: #5A6578;
      font-size: 0.95rem;
      margin: 0 0 1.5rem 0;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      background: #F05A28;
      color: #FFFFFF;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h1>Reindirizzamento in corso...</h1>
    <p>Stiamo aprendo la pagina del tuo libro. Se non vieni reindirizzato automaticamente entro pochi secondi, clicca sul pulsante qui sotto.</p>
    <a href="/">Vai alla Home</a>
  </div>
</body>
</html>
